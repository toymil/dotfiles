[alias]
    lg = log --author-date-order --decorate=short --date=format:'%Y-%m-%d' --graph --format=format:'%>|(9)%C(bold reverse 167) %h %C(120) %ad %C(no-reverse) > %Creset%<(65,trunc)%s%C(bold 229)%d%C(81) <%an>%C(nobold) %G?'
    lga = lg --all
    lgd = log --stat --full-diff --author-date-order --decorate=short --date=format:'%Y-%m-%d' --graph --format=format:'%C(bold reverse 167) %h %C(120) %ad %C(no-reverse) > %Creset%<(65,trunc)%s%C(bold 229)%d%C(81) <%an>%C(nobold) %G?%n'
    lgf = log --author-date-order --decorate=full --date=format:'%Y-%m-%d %H:%M:%S %z' --graph --format=format:'%C(bold 167)Commit     :%C(reverse) %H %C(no-reverse 229)%d%n%C(bold 120)Author Date:%C(reverse) %ad %C(no-reverse) (%ar)%n%C(bold 229)Parent     :%C(reverse) %P %C(no-reverse)%n%C(bold 81)Author     : %an <%ae>%C(nobold) %G?%n%n%B%n'
    lgfd = lgf --patch

    ba  = branch --verbose --verbose --all
    bas = branch --verbose --verbose --all --sort=-committerdate

    s  = status --short
    sl = status --long

    a  = add --verbose
    aa = add --verbose --all
    ap = add --patch

    d   = diff
    ds  = diff --stat
    dc  = diff --cached
    dcs = diff --cached --stat
    dni = diff --no-index

    cm  = commit --message
    cms = commit --gpg-sign --message
    cn  = commit --allow-empty-message --message ''
    cns = commit --gpg-sign --allow-empty-message --message ''
    ca  = commit --amend
    cas = commit --gpg-sign --amend

    m   = merge
    ms  = merge --gpg-sign
    mnc = merge --no-commit
    mff = merge --ff-only
    mnf = merge --no-ff

    fap = fetch --all --prune
    pff = pull --ff-only
    pnf = pull --no-ff

    p   = push
    pa  = push --all
    pf  = push --force-with-lease

    # shallow clone
    cls = clone --depth=1 --recurse-submodules --shallow-submodules
    # shallow clone without submodules
    clsns = clone --depth=1
