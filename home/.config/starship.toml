"$schema" = "https://starship.rs/config-schema.json"

format = """
[>](#7c6f64) $username $hostname[( \\($os( $shell)\\))( \\[$time\\])( -> $status)](#928374)
[-](#7c6f64) $directory(
[-](#7c6f64) ($git_branch )($git_commit )($git_state )$git_status)
$character """
add_newline = true

[username]
    show_always = true
    format = "[$user]($style)"
    style_user = "bold #83a598"
    style_root = "bold #fb4934"

[hostname]
    ssh_only = false
    format = "[@](#ebdbb2)$ssh_symbol [$hostname]($style)"
    ssh_symbol = "[⇌](#d3869b)"
    style = "bold #b8bb26"

[os]
    disabled = false
    format = "[{[$name$symbol( $version)( $codename)]($style)}](#928374)"
    style = "#ebdbb2"
    [os.symbols]
        Unknown = "?"

        Linux = "?"
        Windows = ""
        Macos = ""

        Debian = ""
        openSUSE = ""

[shell]
    disabled = true
    format = "[{[$indicator]($style)}](#928374)"
    style = "#ebdbb2"
    bash_indicator = "Bash"
    powershell_indicator = "PowerShell"

[time]
    disabled = false
    format = "[\\[[$time]($style)\\]](#928374)"
    style = "#ebdbb2"
    time_format = "%Y-%m-%d %a %H:%M:%S %:z"

[status]
    disabled = false
    format = "[\\([$status]($style)\\)](#928374)"
    style = "bold #fb4934"
    success_symbol = " "
    recognize_signal_code = false

[directory]
    truncation_length = 0
    truncate_to_repo = false

    format = "([$read_only]($read_only_style) )[$path]($style)"
    repo_root_format = "([$read_only]($read_only_style) )[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
    read_only = "[RO]"

    style = "#d5c4a1"
    read_only_style = "#cc241d"
    repo_root_style = "bold #fe8019"

[git_branch]
    disabled = false
    format = "[$symbol $branch( : $remote_name/$remote_branch)]($style)"
    symbol = ""
    style = "#ebdbb2"
    always_show_remote = true

[git_commit]
    disabled = false
    only_detached = true
    format = "[\\($hash\\)( \\[$tag\\])]($style)"
    style = "#b8bb26"
    tag_disabled = false
    tag_symbol = ""

[git_state]
    disabled = false
    format = "[\\($state( $progress_current/$progress_total)\\)]($style)"
    style = "#fabd2f"

[git_status]
    disabled = false
    format = "([\\[( $all_status )$ahead_behind\\]]($style))"
    style = "#fe8019"

    up_to_date = ""
    ahead = "⇡$count"
    behind = "⇣$count"
    diverged = "$ahead_count⇡⇣$behind_count"

    deleted = "✖"

[character]
    format = "$symbol"
    success_symbol = "[\\$](bold #fb4934)"
    error_symbol = "[\\$](bold #fabd2f)"
