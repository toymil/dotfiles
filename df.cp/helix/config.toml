theme = "gruvbox"

[editor]
scrolloff = 8
middle-click-paste = false
cursorline = true
idle-timeout = 10
completion-trigger-len = 1
true-color = true
rulers = [50, 80, 100, 120]
bufferline = "multiple"
color-modes = true
text-width = 100

[editor.statusline]
left = [
    "mode",
    "separator",
    "spinner",
    "file-modification-indicator",
    "file-name",
]
center = ["diagnostics", "selections", "position", "position-percentage"]
right = [
    "version-control",
    "spacer",
    "separator",
    "file-type",
    "file-encoding",
    "file-line-ending",
    "separator",
    "workspace-diagnostics",
]
separator = "▒"
# mode.normal = "NORMAL"
# mode.insert = "INSERT"
# mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.file-picker]
hidden = false
parents = false
git-exclude = false

[editor.whitespace.render]
space = "all"
nbsp = "all"
tab = "all"
newline = "none"

[editor.indent-guides]
render = true

[editor.soft-wrap]
wrap-at-text-width = true
