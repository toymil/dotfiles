theme = "gruvbox"

[editor]
scrolloff = 8
cursorline = true
rulers = [50, 80, 100, 120]
bufferline = "multiple"
color-modes = true

[editor.statusline]
left = ["mode", "separator", "spinner", "file-name"]
center = ["diagnostics", "selections", "position"]
right = [
    "file-type",
    "file-encoding",
    "file-line-ending",
    "separator",
    "workspace-diagnostics",
]
# mode.normal = "NORMAL"
# mode.insert = "INSERT"
# mode.select = "SELECT"

[editor.lsp]
display-messages = true

[editor.file-picker]
hidden = false
parents = false
git-exclude = false

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[editor.indent-guides]
render = true
