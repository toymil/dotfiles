[lints.rust]
    unsafe_code = "deny"

[lints.clippy]
    pedantic = "warn"
    nursery = "warn"

    enum_glob_use = "deny"
    unwrap_used = "warn"

    # implicit_return = "warn"
    needless_return = "allow"

    shadow_reuse = "allow"
    shadow_same = "warn"
    shadow_unrelated = "warn"

    cast_possible_wrap = "warn"

    semicolon_if_nothing_returned = "warn"
