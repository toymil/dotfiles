[lints.rust]  # forbid > deny > warn > allow
    # cautiously unsafe
    unsafe_code = "allow"
    unsafe_op_in_unsafe_fn = "warn"

    # useable api
    unreachable_pub = "warn"
    unnameable_types = "warn"

    # import
    unqualified_local_imports = "warn"
    redundant_imports = "warn"
    unused_qualifications = "warn"

    # pointer<->integer cast
    fuzzy_provenance_casts = "warn"
    lossy_provenance_casts = "warn"

    future-incompatible = "warn"

    ambiguous_negative_literals = "deny"
    closure_returning_async_block = "warn"
    elided_lifetimes_in_paths = "warn"
    explicit_outlives_requirements = "warn"
    let_underscore_drop = "deny"
    missing_debug_implementations = "warn"
    must_not_suspend = "deny"
    non_ascii_idents = "deny"
    non_exhaustive_omitted_patterns = "warn"
    redundant_lifetimes = "warn"

[lints.clippy]  # forbid > deny > warn > allow
    ### category: correctness      (default: deny) ###

    ### category: suspicious       (default: warn) ###

    ### category: style            (default: warn) ###
    needless_return = "allow"

    ### category: complexity       (default: warn) ###
    precedence = "deny"

    ### category: perf             (default: warn) ###

    ### category: pedantic        (default: allow) ###
    pedantic = { level = "warn", priority = -1 }

    enum_glob_use = "deny"

    # iterator
    explicit_iter_loop = "allow"
    from_iter_instead_of_collect = "allow"
    needless_for_each = "allow"

    # function
    missing_errors_doc = "allow"
    missing_panics_doc = "allow"
    must_use_candidate = "allow"
    too_many_lines = "allow"
    trivially_copy_pass_by_ref = "allow"

    cast_lossless = "allow"
    if_not_else = "allow"
    ignored_unit_patterns = "allow"
    needless_continue = "allow"

    ### category: restriction     (default: allow) ###
    # dev/prod checks
    unwrap_used = "warn"
    expect_used = "allow"
    #
    panic = "allow"
    todo = "allow"
    unimplemented = "allow"
    unreachable = "allow"
    #
    dbg_macro = "allow"
    print_stderr = "allow"
    print_stdout = "allow"
    #
    allow_attributes = "warn"
    allow_attributes_without_reason = "allow"

    # prefer no_std
    std_instead_of_core = "warn"
    std_instead_of_alloc = "warn"
    alloc_instead_of_core = "warn"

    # must_use
    let_underscore_must_use = "allow"
    unused_result_ok = "deny"

    # indexing
    get_unwrap = "warn"
    indexing_slicing = "allow"
    string_slice = "warn"

    # cautiously unsafe
    undocumented_unsafe_blocks = "warn"
    multiple_unsafe_ops_per_block = "warn"
    unnecessary_safety_doc = "warn"
    unnecessary_safety_comment = "warn"

    # shadowing
    shadow_same = "allow"
    shadow_reuse = "allow"
    shadow_unrelated = "warn"

    as_pointer_underscore = "deny"
    as_underscore = "deny"
    assertions_on_result_states = "warn"
    cfg_not_test = "warn"
    clone_on_ref_ptr = "warn"
    decimal_literal_representation = "warn"
    doc_paragraphs_missing_punctuation = "warn"
    infinite_loop = "warn"
    lossy_float_literal = "deny"
    mixed_read_write_in_expression = "warn"
    pattern_type_mismatch = "warn"
    pointer_format = "warn"
    precedence_bits = "deny"
    pub_without_shorthand = "warn"
    rc_buffer = "warn"
    rc_mutex = "deny"
    redundant_test_prefix = "warn"
    renamed_function_params = "warn"
    rest_pat_in_fully_bound_structs = "warn"
    semicolon_inside_block = "warn"
    semicolon_outside_block = "warn"
    str_to_string = "warn"
    string_add = "warn"
    tests_outside_test_module = "warn"
    try_err = "warn"

    ### category: nursery         (default: allow) ###
    nursery = { level = "warn", priority = -1 }

    debug_assert_with_mut_call = "deny"

    iter_on_empty_collections = "allow"
    iter_on_single_items = "allow"
    missing_const_for_fn = "allow"
    option_if_let_else = "allow"
    redundant_pub_crate = "allow"

    ### category: cargo           (default: allow) ###
    wildcard_dependencies = "deny"

    negative_feature_names = "warn"
    redundant_feature_names = "warn"
